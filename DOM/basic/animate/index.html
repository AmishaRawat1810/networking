<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profiles</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
    }

    main {
      row-gap: 50px;
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      flex-direction: column;
      justify-content: center;
    }

    .circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border-left: 1px solid black;
    }

    .buffer {
      animation: rotate 4s linear infinite;
    }

    .rectangle {
      width: 400px;
      height: 40px;
      border: 1px solid black;
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fill {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="buffer circle"></div>
    <div class="rectangle"></div>
  </main>
</body>

</html>
